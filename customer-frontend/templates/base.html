{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CRM Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <aside class="col-md-2 bg-dark text-white min-vh-100 p-3">

            <h3 class="mb-4">CRM Admin</h3>

            <div class="list-group">

                <a href="/" class="list-group-item">
                    Dashboard
                </a>

                <a href="/users/" class="list-group-item">
                    Users
                </a>

                <a href="/customers/" class="list-group-item">
                    Customers
                </a>

                <a href="/contacts/" class="list-group-item">
                    Contacts
                </a>

                <a href="/audit/" class="list-group-item">
                    Audit Logs
                </a>

                <a href="/logout/" class="list-group-item text-danger">
                    Logout
                </a>

            </div>

        </aside>

        <main class="col-md-10">

            <nav class="navbar navbar-light bg-light border-bottom px-4">

                <span class="navbar-brand">
                    CRM Administration
                </span>

                <span>
                    {{ request.session.email }}
                </span>

            </nav>

            <div class="p-4">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}
                {% endblock %}

            </div>

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
