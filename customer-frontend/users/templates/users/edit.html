{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">

        <h3>Edit User</h3>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.errors %}

                        <div class="text-danger mt-1">

                            {{ field.errors }}

                        </div>

                    {% endif %}

                </div>

            {% endfor %}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>
