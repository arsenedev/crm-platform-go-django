{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Audit Logs
</h2>

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead class="table-light">

                    <tr>
                        <th>Date</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Resource</th>
                        <th>Resource ID</th>
                    </tr>

                </thead>

                <tbody>

                {% for log in logs %}

                    <tr>

                        <td>
                            {{ log.created_at }}
                        </td>

                        <td>
                            {{ log.user_id }}
                        </td>

                        <td>
                            <span class="badge bg-primary">
                                {{ log.action }}
                            </span>
                        </td>

                        <td>
                            {{ log.resource }}
                        </td>

                        <td>
                            {{ log.resource_id }}
                        </td>

                    </tr>

                {% empty %}

                    <tr>

                        <td
                            colspan="5"
                            class="text-center"
                        >
                            No audit logs found
                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
