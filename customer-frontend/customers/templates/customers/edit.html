{% extends "base.html" %}

{% block content %}

<h2>Edit Customer</h2>

<form method="post">

    {% csrf_token %}

    {% for field in form %}

        <div class="mb-3">

            {{ field.label_tag }}

            {{ field }}

            {% if field.errors %}
                <div class="text-danger">
                    {{ field.errors }}
                </div>
            {% endif %}

        </div>

    {% endfor %}

    <button
        type="submit"
        class="btn btn-primary"
    >
        Save Changes
    </button>

</form>

{% endblock %}
